[project]
name = "website-health-monitor"
version = "0.1.0"
description = "A web app and REST API that checks whether public websites are online."
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (unused imports, undefined names, ...)
    "I",     # import sorting
    "B",     # common bugs (flake8-bugbear)
    "UP",    # use modern Python syntax
    "S",     # security checks (flake8-bandit)
    "ASYNC", # async mistakes
    "FAST",  # FastAPI best practices
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # `assert` is how pytest tests are written
