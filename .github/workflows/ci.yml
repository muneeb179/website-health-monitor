
# Name shown in the GitHub Actions tab
name: CI Pipeline

# Run when code is pushed or a pull request targets main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only allow reading repository contents
permissions:
  contents: read

jobs:
  test-and-build:
    # Use a fresh Linux machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
      # Download our repository onto the runner
      - name: Checkout code
        uses: actions/checkout@v6

      # Install the same Python version used locally
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Install application and testing dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Check Python files for syntax errors
      - name: Check Python syntax
        run: python -m compileall -q app tests

      # Check code quality
      - name: Run Ruff
        run: python -m ruff check .

      # Run automated application tests
      - name: Run Pytest
        run: python -m pytest -v

      # Verify that the application can be packaged
      - name: Build Docker image
        run: docker build -t website-health-monitor:ci .
